name: MiniTorch tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test Module 0
        run: |
          python -m pytest tests -x -m task0_1
          python -m pytest tests -x -m task0_2
          python -m pytest tests -x -m task0_3
          python -m pytest tests -x -m task0_4

      - name: Test Module 1
        run: |
          python -m pytest tests -x -m task1_1
          python -m pytest tests -x -m task1_2
          python -m pytest tests -x -m task1_3
          python -m pytest tests -x -m task1_4
          python -m pytest tests/test_scalar.py::test_simple -q
